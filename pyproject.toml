[project]
name = "exethon-2026"
version = "0.1.0"
description = "Agent team workbench: requirements to documents to prototype (Liner .EXE-THON 2026 PoC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "pillow==12.3.0",
    "fpdf2==2.8.3",
    "python-docx==1.1.2",
]

[dependency-groups]
dev = [
    "pypdf==5.1.0",
    "pytest==8.3.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
